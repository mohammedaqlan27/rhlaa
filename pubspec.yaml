name: rhlaa
description: تتطبيق رحلة - منصة حجز وتنقل ذكية

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  table_calendar: ^3.0.8
  qr_flutter: ^4.0.0
  barcode_widget: ^2.0.4
  url_launcher: ^6.3.0


  # ✅ Firebase packages (متوافقة مع SDK 3.2.6)
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  cloud_functions: ^5.1.0
  firebase_storage: ^12.4.10
  firebase_database: ^11.0.0
  firebase_messaging: ^15.2.10
  firebase_functions: ^0.6.0
  geolocator: ^9.0.2
  google_maps_flutter: ^2.4.0

  # ... الحزم الأخرى الموجودة مسبقاً

  provider: ^6.1.5+1
  share_plus: ^7.2.1

  pdf: ^3.10.8
  syncfusion_flutter_xlsio: ^33.1.49
  rxdart: ^0.27.7
  path_provider: ^2.1.3

  # ✅ إضافات مهمة
  image_picker: ^1.0.4
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2
  uuid: ^4.0.0
  flutter_local_notifications: ^17.1.0

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: ^3.0.2
  firebase_auth_mocks: ^0.14.2
  firebase_storage_mocks: ^0.7.0
  path_provider_platform_interface: ^2.1.1
  plugin_platform_interface: ^2.1.8
  http_mock_adapter: ^0.6.1
  flutter_lints: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_native_splash:

  color: "#ffffff"        # لون الخلفية
  image: assets/images/app_logo.png
  android: true
  ios: true
  web: true

flutter_icons:
    android: true
    ios: true
    image_path: "assets/images/app_icon.png"
    min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
  - assets/images/app_icon.png

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
    - family: Amiri
      fonts:
          - asset: assets/fonts/Amiri-Regular.ttf
          - asset: assets/fonts/Amiri-Bold.ttf
            weight: 700
          - asset: assets/fonts/Amiri-Italic.ttf
            style: italic